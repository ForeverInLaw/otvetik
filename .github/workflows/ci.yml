name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check otvetik.py tests
          ruff format --check otvetik.py tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Package plugin and verify version
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          import shutil

          source = Path("otvetik.py")
          module = ast.parse(source.read_text(encoding="utf-8"))
          for node in module.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  version = ast.literal_eval(node.value)
                  break
          else:
              raise SystemExit("Plugin version is missing")

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"Tag {tag} does not match plugin version {version}")

          Path("dist").mkdir(exist_ok=True)
          shutil.copyfile(source, "dist/otvetik.plugin")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otvetik-plugin
          path: dist/otvetik.plugin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otvetik-plugin
          path: dist
      - name: Publish plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/otvetik.plugin \
            --verify-tag \
            --title "Otvetik $RELEASE_TAG" \
            --generate-notes \
            --notes "Скачай otvetik.plugin и открой его в AyuGram или exteraGram. Инструкция: https://github.com/ForeverInLaw/otvetik#установка"
